name: Build and Publish Package
on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Package Name"
        required: true
        type: string
jobs:
  build:
    name: Building package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository (this repo)
        uses: actions/checkout@v4
        with:
          path: repository
      - name: Checkout packages repository
        uses: actions/checkout@v4
        with:
          repository: pytunaOS/packages
          path: packages
      - name: Validate package folder exists
        run: |
          if [ ! -d "packages/${{ inputs.package_name }}" ]; then
            echo "::error::Pasta '${{ inputs.package_name }}' não encontrada em packages"
            exit 1
          fi
          if [ ! -f "packages/${{ inputs.package_name }}/PKGBUILD" ]; then
            echo "::error::PKGBUILD não encontrado em ${{ inputs.package_name }}"
            exit 1
          fi
      - name: Pull Arch Linux container
        run: docker pull archlinux:latest
      - name: Build package with makepkg
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/packages/${{ inputs.package_name }}:/pkgbuild" \
            -w /pkgbuild \
            archlinux:latest \
            bash -c '
              set -euo pipefail
              pacman -Syu --noconfirm
              pacman -S --noconfirm base-devel sudo git
              useradd -m builder
              chown -R builder:builder /pkgbuild
              echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
              su builder -c "cd /pkgbuild && makepkg -s --noconfirm --needed"
            '
      - name: Locate built package
        id: locate
        run: |
          PKG_FILE=$(find "packages/${{ inputs.package_name }}" -maxdepth 1 -name "*.pkg.tar.zst" | head -n1)
          if [ -z "$PKG_FILE" ]; then
            echo "::error::Nenhum arquivo .pkg.tar.zst foi gerado"
            exit 1
          fi
          echo "pkg_file=$PKG_FILE" >> "$GITHUB_OUTPUT"
          echo "pkg_basename=$(basename "$PKG_FILE")" >> "$GITHUB_OUTPUT"
      - name: Copy package into repo pool
        run: |
          mkdir -p repository/x86_64
          cp "${{ steps.locate.outputs.pkg_file }}" "repository/x86_64/"
      - name: Sign package and update pacman database with repo-add
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/repository:/repo" \
            -e GPG_PRIVATE_KEY="${{ secrets.GPG_PRIVATE_KEY }}" \
            -e GPG_FINGERPRINT="${{ secrets.GPG_FINGERPRINT }}" \
            -e GPG_PASSPHRASE="${{ secrets.GPG_PASSPHRASE }}" \
            -w /repo \
            archlinux:latest \
            bash -c '
              set -euo pipefail
              pacman -Syu --noconfirm
              pacman -S --noconfirm pacman-contrib gnupg

              echo "$GPG_PRIVATE_KEY" | gpg --batch --import
              echo "${GPG_FINGERPRINT}:6:" | gpg --import-ownertrust

              PKG="x86_64/${{ steps.locate.outputs.pkg_basename }}"

              gpg --batch --yes --pinentry-mode loopback \
                --passphrase "$GPG_PASSPHRASE" \
                --default-key "$GPG_FINGERPRINT" \
                --detach-sign "$PKG"

              repo-add --sign --key "$GPG_FINGERPRINT" \
                x86_64/pytuna.db.tar.gz "$PKG"
            '
      - name: Replace symlinks with real files
        working-directory: repository/x86_64
        run: |
          for link in pytuna.db pytuna.files pytuna.db.sig pytuna.files.sig; do
            if [ -L "$link" ]; then
              target=$(readlink "$link")
              rm "$link"
              cp "$target" "$link"
              echo "Resolvido: $link -> cópia real de $target"
            fi
          done
      - name: Commit and push to repository
        working-directory: repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add x86_64
          git commit -m "Update ${{ inputs.package_name }} (${{ steps.locate.outputs.pkg_basename }})" || echo "Nada para commitar"
          git push origin HEAD
